# nfpm packaging config: produces derp-guard_<DEB_VERSION>_<NFPM_ARCH>.deb
# Usage (env vars are injected by CI):
#   NFPM_ARCH=amd64 DEB_VERSION=1.82.0-42 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
name: derp-guard
arch: ${NFPM_ARCH}
platform: linux
version: ${DEB_VERSION}
section: net
priority: optional
maintainer: s8ga <s8ga@users.noreply.github.com>
description: |
  Unmodified upstream Tailscale DERP server (derper) bundled with a cross-tailnet
  OAuth admission controller (derp-guard). derp-guard runs as the parent process,
  supervises derper, and only admits devices that are authorized (and not shared
  in externally) in the configured tailnets.
homepage: https://github.com/s8ga/derp-guard
license: MIT

contents:
  - src: ./build/derp-guard
    dst: /usr/bin/derp-guard
    file_info:
      mode: 0755

  - src: ./build/derper
    dst: /usr/libexec/derper
    file_info:
      mode: 0755

  - src: ./packaging/config.example.toml
    dst: /etc/derp-guard/config.toml
    type: config|noreplace
    file_info:
      mode: 0600

  - src: ./packaging/derp-guard.service
    dst: /lib/systemd/system/derp-guard.service
    file_info:
      mode: 0644
